<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cat Pacman Terraria Style</title>
<style>
  body {
    margin: 0;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: monospace;
  }
  canvas {
    border: 4px solid #3a3a5a;
    background: #0f3460;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="480"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const tileSize = 24;
const rows = 20;
const cols = 20;

// Simple map (1 = wall, 0 = pellet)
const map = [
  "11111111111111111111",
  "10000000001100000001",
  "10111111101101111101",
  "10000000000000000001",
  "10111101111111011101",
  "10000001000001000001",
  "11111011101110111101",
  "10000000001100000001",
  "10111111101101111101",
  "10000000000000000001",
  "11111101111111011111",
  "10000001000001000001",
  "10111101111111011101",
  "10000000000000000001",
  "10111111101101111101",
  "10000000001100000001",
  "10111101111111011101",
  "10000000000000000001",
  "10111111101101111101",
  "11111111111111111111"
];

let cat = {
  x: 1,
  y: 1,
  dx: 0,
  dy: 0
};

let score = 0;

function drawTile(x, y, type) {
  if (type === '1') {
    ctx.fillStyle = '#2ecc71'; // Terraria grass block vibe
    ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
  } else {
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.arc(x * tileSize + tileSize/2, y * tileSize + tileSize/2, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCat() {
  const px = cat.x * tileSize + tileSize/2;
  const py = cat.y * tileSize + tileSize/2;

  // body
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath();
  ctx.arc(px, py, 10, 0, Math.PI * 2);
  ctx.fill();

  // ears
  ctx.fillStyle = '#ff9966';
  ctx.beginPath();
  ctx.moveTo(px - 8, py - 8);
  ctx.lineTo(px - 2, py - 16);
  ctx.lineTo(px, py - 6);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(px + 8, py - 8);
  ctx.lineTo(px + 2, py - 16);
  ctx.lineTo(px, py - 6);
  ctx.fill();

  // eyes
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px - 3, py - 2, 2, 0, Math.PI * 2);
  ctx.arc(px + 3, py - 2, 2, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      drawTile(x, y, map[y][x]);
    }
  }

  drawCat();

  ctx.fillStyle = '#fff';
  ctx.fillText('Score: ' + score, 10, 20);
}

function update() {
  let newX = cat.x + cat.dx;
  let newY = cat.y + cat.dy;

  if (map[newY][newX] !== '1') {
    cat.x = newX;
    cat.y = newY;

    if (map[newY][newX] === '0') {
      map[newY] = map[newY].substring(0, newX) + ' ' + map[newY].substring(newX + 1);
      score++;
    }
  }
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') { cat.dx = 0; cat.dy = -1; }
  if (e.key === 'ArrowDown') { cat.dx = 0; cat.dy = 1; }
  if (e.key === 'ArrowLeft') { cat.dx = -1; cat.dy = 0; }
  if (e.key === 'ArrowRight') { cat.dx = 1; cat.dy = 0; }
});

function gameLoop() {
  update();
  draw();
}

setInterval(gameLoop, 150);
</script>
</body>
</html>
